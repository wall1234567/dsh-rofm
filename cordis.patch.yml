# ============================================================================
# dsh-rofm —— DSH bundle patch
# ============================================================================
# 只插入一个纯 Host 插件行：没有 Client 半区，没有额外进程。
#
# 安装（本地目录会以 link 形式挂进当前 profile）：
#   plugin_manager(action: "install_bundle", target: "<插件目录绝对路径>")
#   从 GitHub clone 下来的目录同样适用。
#
# 关闭插件的两种方式：
#   1. 在插件管理里禁用 dsh-rofm 这一行（Cordis 会卸载工具 / prompt sections /
#      监听器，彻底停止；重新启用该行即恢复）。
#   2. 把 config.json 里的 "enabled" 改成 false。这是“启动时开关”：插件加载时
#      读到 false 会直接空转（不注册工具/section/监听器，不跑 QQ 兼容自检、
#      自动补丁或 staging 清理；config.json 仍会被读取以判定）。因为该判定只在
#      激活时做一次，运行期把 false 改回 true 需要重载插件行或重启 DSH 才生效
#      （其他配置项仍是内容变化即热加载）。
#
# 绝大多数参数都在插件目录的 config.json 里调，不需要动这里。
# 如果你想在 profile 层覆盖少数参数，取消下面 config 的注释即可。覆盖是**按字段
# 深合并**：内置默认值 ← 插件目录 config.json ← 本行 config；本行写了的字段覆盖
# 下层，没写的字段沿用 config.json / 内置默认值（不是整体替换 config.json）：
# ============================================================================

- insert:
    - id: dsh-rofm
      name: dsh-rofm
      # config:
      #   compress:
      #     triggerPercent: 60
      #     compressPercent: 20
      #     releaseTargetPercent: 50      # v1.4.1 归档释放下限：至少压到该百分比以下
      #     releaseFloorEnabled: true     # false = 仅“压到 trigger 以下”的旧口径
      #   recall:
      #     firstGenMax: 10
      #     mu: 5
      #     sigma: 3
      #   scoring:
      #     taskBudgetPercent: 15
